{% extends 'base.html' %}
{% block title %}Register — SmartBus Maharashtra{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card" style="max-width:480px;">
    <div class="auth-logo">🚌</div>
    <h2>Create Account</h2>
    <p class="sub">Book buses across Maharashtra</p>
    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" class="form-control" required value="{{ name or '' }}" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" class="form-control" required value="{{ email or '' }}" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" name="mobile" class="form-control" required value="{{ mobile or '' }}" pattern="[0-9]{10}" placeholder="10-digit number">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" required placeholder="Min 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" required placeholder="Repeat password">
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Create Account</button>
    </form>
    <p class="text-center mt-2" style="font-size:.85rem;">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
