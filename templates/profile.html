{% extends 'base.html' %}
{% block title %}My Profile — SmartBus Maharashtra{% endblock %}
{% block content %}
<div class="page-header">
  <div class="container"><h1>My Profile</h1><p>Manage your account details</p></div>
</div>
<div class="container section">
  <div style="max-width:500px;">
    <div class="card">
      <div class="card-header">Account Information</div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('profile') }}">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="form-control" value="{{ user.email }}" disabled style="background:#f3f4f6;">
            <small class="text-muted">Email cannot be changed.</small>
          </div>
          <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" name="mobile" class="form-control" value="{{ user.mobile }}" pattern="[0-9]{10}" required>
          </div>
          <div class="form-group">
            <label>Member Since</label>
            <input type="text" class="form-control" value="{{ user.created_at.strftime('%d %B %Y') if user.created_at else '' }}" disabled style="background:#f3f4f6;">
          </div>
          <button type="submit" class="btn btn-primary">Update Profile</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
